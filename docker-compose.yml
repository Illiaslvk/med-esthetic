version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: med-esthetic-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/med_esthetic_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: med_esthetic_db
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    build:
      context: ./med-esthetic-ui
      dockerfile: Dockerfile
    image: med-esthetic-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
